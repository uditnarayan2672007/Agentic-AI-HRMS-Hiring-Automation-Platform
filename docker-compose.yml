version: "3.9"

services:
  # ── PostgreSQL + pgvector ────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: hrms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hrms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI HRMS Backend ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms_api
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:password@db:5432/hrms_db"
      DATABASE_URL_SYNC: "postgresql+psycopg2://postgres:password@db:5432/hrms_db"
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./generated_docs:/app/generated_docs
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
